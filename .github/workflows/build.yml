      - name: Setup KernelSU-Next (Manual Integration)
        run: |
          # 1. Clone the driver
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          
          # 2. Prepare the drivers directory
          # We move the entire kernel folder from the clone into drivers
          mkdir -p drivers/ksu
          cp -r KernelSU-Next/kernel/* drivers/ksu/
          
          # 3. Add to the drivers Makefile
          # Using 'ksu/' is cleaner and avoids naming conflicts
          if ! grep -q "obj-y += ksu/" drivers/Makefile; then
            echo "obj-y += ksu/" >> drivers/Makefile
          fi
          
          echo "KernelSU-Next integrated into drivers/ksu successfully."

      - name: Build Kernel
        run: |
          # Start build timer
          START=$(date +%s)
          
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Custom version name
          CUSTOM_NAME="-KSU-Next-cyber"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. DISABLE LTO (Link Time Optimization)
          # This prevents many common 'Section Mismatch' and 'LD' errors
          ./scripts/config --file out/.config -d LTO
          ./scripts/config --file out/.config -d LTO_CLANG
          ./scripts/config --file out/.config -d LTO_CLANG_THIN
          ./scripts/config --file out/.config -d LTO_CLANG_FULL
          ./scripts/config --file out/.config -e LTO_NONE
          
          # 3. Enable KernelSU Requirements
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e KPROBES_ON_FTRACE
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e KERNELSU

          # 4. Final Build
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          
          # End build timer
          END=$(date +%s)
          DIFF=$(( $END - $START ))
          echo "Build took $(( $DIFF / 60 )) minutes and $(( $DIFF % 60 )) seconds."
          
