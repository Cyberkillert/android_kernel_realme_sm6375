name: Build RMX3660 Kernel (SM6375)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev curl git \
          zip unzip python3

      - name: Clone Android Clang
        run: |
          git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export PATH=$PWD/clang/clang-r*/bin:$PATH

          # Clean previous builds
          make O=out clean

          # IMPORTANT: Change this if your defconfig name is different
          make O=out defconfig

          # Build
          make O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: RMX3660-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
