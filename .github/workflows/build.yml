name: Build Android Kernel Holi Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libssl-dev libelf-dev libncurses-dev \
            python3 unzip zip cpio rsync \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            device-tree-compiler

      - name: Clone Neutron Clang + AnyKernel3
        run: |
          mkdir clang
          cd clang

          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S

          cd ..

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel + DTBO + Modules
        run: |
          export PATH=$PWD/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          KERNEL_NAME="-Cyber-Holi"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          LOCALVERSION=${KERNEL_NAME}
          "

          mkdir -p out

          make $MAKE_ARGS vendor/holi-qgki_defconfig

          # Required
          ./scripts/config --file out/.config -e CONFIG_MODULES
          ./scripts/config --file out/.config -e CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG

          # Qualcomm
          ./scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY

          # Realme/Oplus
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG

          make $MAKE_ARGS olddefconfig

          # Build everything
          make -j$(nproc) $MAKE_ARGS Image dtbs dtbo.img modules

      - name: Install Modules Properly
        run: |
          export PATH=$PWD/clang/bin:$PATH

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          "

          mkdir -p out/modules_staging

          make $MAKE_ARGS \
            INSTALL_MOD_PATH=$PWD/out/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "=== BUILT MODULES ==="
          find out/modules_staging -name "*.ko"

      - name: Prepare AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/

          # DTBO
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/

          # DTB
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb

          # Modules
          mkdir -p AnyKernel3/modules/vendor/lib/modules/

          KVER=$(ls out/modules_staging/lib/modules/)

          cp -r out/modules_staging/lib/modules/$KVER/* \
            AnyKernel3/modules/vendor/lib/modules/

          # Strip modules
          export PATH=$PWD/clang/bin:$PATH

          find AnyKernel3/modules -name "*.ko" \
            -exec llvm-strip --strip-debug {} \;

          # AnyKernel configs
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.modules=0/do.modules=1/g' AnyKernel3/anykernel.sh

          # Enable DTBO flashing
          echo 'dtbo=1' >> AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Cyber-Holi-Kernel.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Holi-Kernel
          path: Cyber-Holi-Kernel.zip
