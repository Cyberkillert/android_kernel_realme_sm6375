name: Build kernels

on:
  workflow_dispatch:

jobs:
  Set_repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Matrix
        id: set-matrix
        run: |
          if [ ! -f repos.json ]; then
            echo "Error: repos.json file not found in the repository root!"
            exit 1
          fi
          JSON=$(cat repos.json | tr -d '\n' | tr -d ' ')
          echo "matrix=${JSON}" >> $GITHUB_OUTPUT

  Build-Kernel:
    needs: Set_repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.Set_repos.outputs.matrix) }}
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Create Working Directory
        run: mkdir -p workdir

      - name: Install Prerequisites
        run: |
          sudo apt update
          sudo apt install -y curl git make binutils bc bison flex python3 zip unzip cpio tar findutils sed grep coreutils kmod libssl-dev build-essential ccache jq libelf-dev

      - name: Clone Kernel Source
        run: |
          git clone -b ${{ matrix.kernelSource.branch }} ${{ matrix.kernelSource.repo }} workdir/kernel_workspace

          cd workdir/kernel_workspace

          echo "Disabling SPI CRC by default..."
          sed -i 's/bool use_spi_crc = 1;/bool use_spi_crc = 0;/' drivers/mmc/core/core.c

          echo "Allowing mismatched kernel modules to load..."
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/module.c")
          data = path.read_text()

          old = '''bad_version:
          pr_warn("%s: disagrees about version of symbol %s\\n",
                  info->name, symname);
          return 0;'''

          new = '''bad_version:
          pr_warn("%s: disagrees about version of symbol but we'll look past that... %s\\n",
                  info->name, symname);
          return 1;'''

          if old not in data:
              raise SystemExit("ERROR: bad_version block not found in kernel/module.c")

          path.write_text(data.replace(old, new, 1))
          PY

      - name: Download Toolchains
        run: |
          cd workdir
          mkdir -p toolchains
          echo '${{ toJSON(matrix.toolchains) }}' > toolchains.json
          jq -c '.[]' toolchains.json | while read -r toolchain; do
            REPO=$(echo "$toolchain" | jq -r '.repo')
            BRANCH=$(echo "$toolchain" | jq -r '.branch')
            NAME=$(echo "$toolchain" | jq -r '.name')
            echo "Cloning toolchain: $NAME from $REPO [$BRANCH]..."
            git clone -b "$BRANCH" --depth=1 "$REPO" "toolchains/$NAME"
          done

      - name: Update KernelSU Next & Apply Manual Hooks
        if: ${{ matrix.withKernelSU == true }}
        run: |
          cd workdir/kernel_workspace
          
          echo "Injecting KernelSU Next (Legacy branch)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          echo "Downloading automated system call hook patchset..."
          curl -O https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          
          echo "Injecting mandatory config flags into defconfig..."
          TARGET_CONFIG="arch/arm64/configs/${{ matrix.kernelSource.defconfig }}"
          echo "CONFIG_KSU=y" >> "$TARGET_CONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$TARGET_CONFIG"
          
          echo "Applying legacy compiler compatibility fix (bcmp -> memcmp)..."
          if [ -f scripts/kconfig/confdata.c ]; then
            sed -i 's/bcmp/memcmp/g' scripts/kconfig/confdata.c
          fi
          
          echo "Applying WALT header return type fix..."
          if [ -f kernel/sched/walt/walt.h ]; then
            sed -i 's/static inline int cpu_boost_init(void) { }/static inline int cpu_boost_init(void) { return 0; }/g' kernel/sched/walt/walt.h
            sed -i 's/static inline int cpu_boost_init(void) {}/static inline int cpu_boost_init(void) { return 0; }/g' kernel/sched/walt/walt.h
          fi

          echo "Applying dummy NOHZ_KICK_MASK fix for WALT scheduler (qc_vas.c)..."
          if [ -f kernel/sched/walt/qc_vas.c ]; then
            cat << 'EOF' > patch_nohz.h
          #include <linux/atomic.h>
          #ifndef NOHZ_KICK_MASK
          #define NOHZ_KICK_MASK 0
          static atomic_t dummy_nohz_flags = ATOMIC_INIT(0);
          #define nohz_flags(cpu) (&dummy_nohz_flags)
          #endif
          EOF
          
