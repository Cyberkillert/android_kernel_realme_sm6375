name: Build Luigi Kernel - Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Exact Kernel
        run: |
          set -e

          git clone https://github.com/LineageOS/android_kernel_realme_sm6375.git kernel

          cd kernel

          git checkout 84e7d691ee3a094de68628c488847a4dd632e7eb

          echo "========================================"
          echo "KERNEL COMMIT"
          echo "========================================"

          git log -1 --oneline

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            git \
            curl \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            python3 \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            clang \
            lld

      - name: Verify Toolchain
        run: |
          echo "========================================"
          echo "CLANG"
          echo "========================================"

          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          ld.lld --version

          echo
          echo "========================================"
          echo "LLVM"
          echo "========================================"

          llvm-ar --version
          llvm-nm --version
          llvm-strip --version

      - name: Inspect Defconfigs
        run: |
          cd kernel

          echo "========================================"
          echo "ALL DEFCONFIGS"
          echo "========================================"

          find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | sort

          echo
          echo "========================================"
          echo "HOLI/QGKI REFERENCES"
          echo "========================================"

          grep -RniE \
            "holi|qgki|luigi|sm6375" \
            arch/arm64/configs \
            2>/dev/null \
            | head -100 || true

      - name: Build With Device Defconfig
        run: |
          set -e

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          clang --version
          ld.lld --version

          echo
          echo "========================================"
          echo "SEARCHING FOR QGKI DEFCONFIG"
          echo "========================================"

          DEFCONFIG=$(find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | grep -Ei "holi|qgki|sm6375|luigi" \
            | head -1 || true)

          if [ -z "$DEFCONFIG" ]; then
            echo "No Holi/QGKI-specific defconfig found."
            echo
            echo "Available defconfigs:"
            find arch/arm64/configs \
              -type f \
              -name "*defconfig" \
              | sort
            exit 1
          fi

          echo "Found:"
          echo "$DEFCONFIG"

          DEFCONFIG_NAME="${DEFCONFIG#arch/arm64/configs/}"
          DEFCONFIG_NAME="${DEFCONFIG_NAME%.config}"

          echo
          echo "========================================"
          echo "DEFCONFIG NAME"
          echo "========================================"

          echo "$DEFCONFIG_NAME"

          echo
          echo "========================================"
          echo "CREATE CONFIG"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG_NAME"

          echo
          echo "========================================"
          echo "IMPORTANT CONFIG"
          echo "========================================"

          grep -E \
            'CONFIG_(MODULES|MODVERSIONS|CFI_CLANG|LTO|LTO_CLANG|LTO_NONE|SHADOW_CALL_STACK|STACKPROTECTOR|QCA_CLD_WLAN|MSM_BT_POWER|BTFM_SLIM|MSM_RDBG)=' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Show Build Output
        if: always()
        run: |
          cd kernel

          echo "========================================"
          echo "KERNEL OUTPUT"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "========================================"
          echo "CONFIG"
          echo "========================================"

          if [ -f out/.config ]; then
            grep -E \
              'CONFIG_(MODULES|MODVERSIONS|CFI_CLANG|LTO|LTO_CLANG|LTO_NONE|SHADOW_CALL_STACK|STACKPROTECTOR|QCA_CLD_WLAN|MSM_BT_POWER|BTFM_SLIM|MSM_RDBG)=' \
              out/.config \
              || true
          fi
