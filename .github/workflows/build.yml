name: Build Realme SM6375 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          git bc bison flex build-essential \
          libssl-dev curl python3 rsync

      - name: Clone Android Kernel Build System
        run: |
          git clone https://android.googlesource.com/kernel/build kernel-build

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/clang-r*/bin:$PATH
          export BUILD_CONFIG=build.config.msm.gki
          bash kernel-build/build.sh

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Realme-Kernel
          path: out/android-kernel/dist/*
