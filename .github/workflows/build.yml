name: Build Luigi SM6375 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex build-essential \
            zip unzip curl wget cpio \
            libssl-dev libelf-dev \
            python3 python3-pip \
            rsync

      - name: Clone exact LineageOS kernel
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_kernel_realme_sm6375.git \
            kernel

          cd kernel

          git fetch --depth=1 origin \
            84e7d691ee3a094de68628c488847a4dd632e7eb

          git checkout 84e7d691ee3a094de68628c488847a4dd632e7eb

          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

      - name: Check kernel tree
        run: |
          cd kernel

          echo "===== ARCH ====="
          ls arch/arm64

          echo "===== DEFCONFIG FILES ====="
          find . -iname "*defconfig" | head -100

          echo "===== CONFIG REFERENCES ====="
          grep -R "QCA_CLD_WLAN" -n \
            arch/arm64/configs \
            drivers \
            techpack 2>/dev/null | head -50 || true

      - name: Find correct defconfig
        run: |
          cd kernel

          find arch/arm64/configs -type f -name "*defconfig" \
            -print | sort

      - name: Build kernel
        run: |
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          # IMPORTANT:
          # Replace this after checking the output of
          # "Find correct defconfig".
          #
          # Example:
          # make O=out luigi_defconfig

          make O=out defconfig

          echo "===== IMPORTANT CONFIG ====="

          grep -E \
            'CONFIG_(MODULES|MODVERSIONS|CFI|LTO|STACKPROTECTOR|SHADOW_CALL_STACK|QCA_CLD_WLAN|MSM_BT_POWER|BTFM_SLIM)=' \
            out/.config || true

          echo "===== BUILD ====="

          make -j2 O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Show output
        if: always()
        run: |
          cd kernel

          echo "===== OUTPUT ====="
          find out/arch/arm64 -maxdepth 3 -type f \
            \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" \) \
            -print

      - name: Package kernel
        if: success()
        run: |
          mkdir -p artifact

          find kernel/out/arch/arm64 \
            -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) \
            -exec cp {} artifact/ \;

          cd artifact

          zip -r ../luigi-kernel.zip .

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: luigi-kernel
          path: |
            kernel/out/arch/arm64/boot/*
            luigi-kernel.zip
