name: Build SM6375 Kernel (KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig'
        required: true
        default: 'vendor/holi-qgki_defconfig'
      package_ak3:
        description: 'Also build AnyKernel3 zip'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download AOSP Clang & Prebuilt Build Tools
        run: |
          mkdir -p toolchain/clang
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          rm -f clang.tar.gz

      - name: Compile Kernel (Image, dtbs, dtbo, modules)
        run: |
          export PATH="$PWD/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.defconfig }}

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Collect Prebuilt Kernel Artifacts for ROM
        run: |
          mkdir -p release/prebuilt
          cp out/arch/arm64/boot/Image release/prebuilt/
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cat {} + > release/prebuilt/dtb.img || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img release/prebuilt/
          find out -name "*.ko" -exec cp {} release/prebuilt/ \;

      - name: Package AnyKernel3 Zip (Optional)
        if: ${{ github.event.inputs.package_ak3 }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cp release/prebuilt/Image ak3/
          [ -f release/prebuilt/dtb.img ] && cp release/prebuilt/dtb.img ak3/dtb
          [ -f release/prebuilt/dtbo.img ] && cp release/prebuilt/dtbo.img ak3/
          cd ak3 && zip -r9 ../release/PenguinKernel-luigi-KSUN.zip *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm6375-luigi-kernel
          path: release/
          
