name: Build Android Kernel (Cyber-Gaming-Full)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Use an array for flags
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # --- MODULE & HARDWARE FIXES ---
          # Disable strict version checking (Fixes broken Wi-Fi/Camera)
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -d MODVERSIONS
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -d MODULE_SIG_ALL
          ./scripts/config --file out/.config -d MODULE_SIG_FORCE
          ./scripts/config --file out/.config -e MODULE_FORCE_LOAD

          # --- FAST CHARGING FIX ---
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHARGER_MTK
          ./scripts/config --file out/.config -e CONFIG_POWER_SUPPLY
          ./scripts/config --file out/.config -e CONFIG_QPNP_SMB5
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_TATT_SUPPORT
          ./scripts/config --file out/.config -d CONFIG_OPLUS_CHG_LITE
          
          # --- PERFORMANCE TWEAKS ---
          ./scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE
          ./scripts/config --file out/.config -e HZ_1000

          # Sync config
          make "${MAKE_FLAGS[@]}" olddefconfig

          # 2. Build the kernel and all modules
          # Added 'all' to ensure modules are compiled
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y all

      - name: Prepare AnyKernel3 Zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            # 1. Copy Kernel
            cp out/arch/arm64/boot/Image AnyKernel3/
            
            # 2. Collect and Strip Modules (.ko files)
            # This reduces size and prepares them for injection
            mkdir -p AnyKernel3/modules/vendor/lib/modules
            find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
            
            # Optional: Strip debug symbols from modules to save space
            # aarch64-linux-gnu-strip --strip-debug AnyKernel3/modules/vendor/lib/modules/*.ko
            
            # 3. Zip everything
            cd AnyKernel3
            rm -f *.zip
            zip -r9 Kernel-Cyberkillert-Holi.zip *
            mv Kernel-Cyberkillert-Holi.zip ../
          else
            echo "FATAL: Build failed!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Cyber-Gaming-Package
          path: ./Kernel-Cyberkillert-Holi.zip
