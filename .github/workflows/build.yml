name: Build Android Kernel (Cyber-Gaming)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Branding for the Gaming version
          CUSTOM_NAME="-Cluster-Gaming-MAX"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-gki_defconfig

          # --- GAMING & PERFORMANCE TWEAKS ---
          
          # Enable Performance Governor by default
          ./scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE
          ./scripts/config --file out/.config -d CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
          ./scripts/config --file out/.config -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE

          # Enable BBR TCP Congestion Control (Lower Ping for Online Gaming)
          ./scripts/config --file out/.config -e TCP_CONG_BBR
          ./scripts/config --file out/.config -d DEFAULT_TCP_CONG_CUBIC
          ./scripts/config --file out/.config -e DEFAULT_TCP_CONG_BBR

          # Optimize for Low Latency (Tick rate)
          ./scripts/config --file out/.config -e HZ_1000
          ./scripts/config --file out/.config -d HZ_300

          # Disable Debugging/Logging (Reduces CPU overhead for more FPS)
          ./scripts/config --file out/.config -d SLUB_DEBUG
          ./scripts/config --file out/.config -d SCHED_DEBUG
          ./scripts/config --file out/.config -d DEBUG_MISC

          # Enable Graphics/GPU Performance boost
          ./scripts/config --file out/.config -e MSM_ADRENO_DEFAULT_GOV_PERFORMANCE
          
          # --- END TWEAKS ---

          # 3. Build the kernel
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          DATE=$(date +%Y%m%d)
          ZIP_NAME="Kernel-Cyber-Gaming-Holi-${DATE}.zip"
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 "$ZIP_NAME" *
            mv "$ZIP_NAME" ../
            echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "FATAL: Build failed!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: ./${{ env.FINAL_ZIP_NAME }}
          
