name: Build Realme sm6375 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev build-essential git curl

      - name: Setup AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Build Kernel (GKI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/clang-r*/bin:$PATH
          export CC=clang
          export LD=ld.lld

          make O=out gki_defconfig
          make O=out -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image
