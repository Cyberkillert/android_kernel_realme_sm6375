name: Build RMX3660 Kernel (SM6375)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu curl git zip unzip python3 file

      - name: Download AOSP Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          # Using a direct archive link from Google Source
          # We use the 'r450784d' version which is highly compatible with Holi kernels
          cd $GITHUB_WORKSPACE/clang
          curl -Lo clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz"
          
          # Verification: Ensure it's not an HTML error page
          if file clang.tar.gz | grep -q "gzip compressed data"; then
              tar -xzf clang.tar.gz
              echo "Clang extracted successfully."
          else
              echo "ERROR: Download failed. Google Source served an HTML page instead of a zip."
              exit 1
          fi

      - name: Build Kernel
        run: |
          # Add Clang to PATH so the build system finds 'ld.lld'
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          
          # Step 1: Initialize with GKI base config
          make O=out gki_defconfig
          
          # Step 2: Merge the Realme/Holi vendor fragments
          # This repo uses the GKI structure where vendor configs are merged
          if [ -f arch/arm64/configs/vendor/holi.config ]; then
              scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/holi.config
          else
              echo "Warning: holi.config not found, trying vendor/sm6375.config"
              scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/sm6375.config
          fi
          
          # Step 3: Final compilation
          make O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: RMX3660-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            
