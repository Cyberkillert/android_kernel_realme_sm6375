name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Apply NetHunter Patches
        run: |
          # Clone NetHunter kernel patches for Android
          git clone https://github.com/kimocoder/kali-nethunter-patches.git nethunter
          
          # Apply HID (BadUSB) and WiFi Injection patches
          # We use the generic 5.x patches which usually work for Holi (5.10)
          chmod +x nethunter/*.sh
          ./nethunter/patch-work.sh || echo "Patches partially applied or manual check needed"
          
          echo "NetHunter drivers integrated."

      - name: Build Kernel
        run: |
          # Setup toolchain path
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Use an array for flags to keep things clean
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. Enable NetHunter Specific Configs (HID, WiFi, Bluetooth Injection)
          ./scripts/config --file out/.config -e USB_F_HID
          ./scripts/config --file out/.config -e USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config -e MAC80211
          ./scripts/config --file out/.config -e CFG80211
          ./scripts/config --file out/.config -e CFG80211_WEXT
          ./scripts/config --file out/.config -e RFKILL
          ./scripts/config --file out/.config -e BT_HCIUART
          ./scripts/config --file out/.config -e BT_HCIBTUSB

          # 3. Build the kernel (Injecting mismatch bypass here)
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          # Verify image existence
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            # Remove any existing zips before creating a new one
            rm -f *.zip
            zip -r9 Kernel-holi.zip *
          else
            echo "FATAL: Kernel Image (vmlinux) failed to compile!"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel
          path: AnyKernel3/Kernel-holi.zip
          
