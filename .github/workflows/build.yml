name: Build Android Kernel (Cyber-Techpack-Master)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel 5.4 (Full Techpack)
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          CUSTOM_NAME="-qgki-Cyber-Final"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load Defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # --- FORCE TECHPACK DRIVERS ---
          # This ensures the compiler doesn't skip your folders in the screenshot
          ./scripts/config --file out/.config -e CONFIG_MSM_CAMERA
          ./scripts/config --file out/.config -e CONFIG_QCA_CLD_WLAN
          ./scripts/config --file out/.config -e CONFIG_AUDIO_REACH
          
          # --- NATIVE MODULE BYPASS ---
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -d MODVERSIONS
          ./scripts/config --file out/.config -e MODULE_FORCE_LOAD
          ./scripts/config --file out/.config -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          # Sync and Build
          make "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y olddefconfig
          
          # We use 'all' to ensure it hits the techpack/ folder
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y all

      - name: Prepare AnyKernel3 (Deep Module Collection)
        run: |
          # Setup AnyKernel3 for Realme A/B
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.modules=0/do.modules=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh

          # 1. Copy Image
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # 2. THE DEEP COLLECTOR
          # This finds modules in techpack/camera, techpack/audio, etc.
          mkdir -p AnyKernel3/modules/vendor/lib/modules/5.4-gki
          mkdir -p AnyKernel3/modules/vendor_dlkm/lib/modules
          
          # Find all modules in the 'out' directory (where techpack builds go)
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/5.4-gki/ \;
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor_dlkm/lib/modules/ \;
          
          # 3. Strip Symbols
          find AnyKernel3/modules/ -name "*.ko" -exec aarch64-linux-gnu-strip --strip-debug {} \;

          cd AnyKernel3
          zip -r9 ../Cyber-Full-Techpack.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Kernel-Full
          path: ./Cyber-Full-Techpack.zip
