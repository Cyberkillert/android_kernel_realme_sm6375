name: Build Android Kernel Holi Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT KERNEL SOURCE
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            wget \
            unzip \
            zip \
            cpio \
            rsync \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      # ============================================================
      # ANDROID CLANG 21
      #
      # Stock kernel reported:
      #
      # clang version 21.0.0
      # LLD 21.0.0
      #
      # ============================================================

      - name: Download Android Clang 21
        run: |
          set -e

          mkdir -p toolchain

          echo "Downloading Android LLVM toolchain..."

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang

          echo "Available Clang versions:"
          find toolchain/clang -maxdepth 2 -type d | sort | head -50

      # ============================================================
      # PREPARE CLANG
      # ============================================================

      - name: Select Clang 21
        run: |
          set -e

          CLANG_DIR=$(find toolchain/clang -maxdepth 2 -type d -name "clang-r*" | sort | tail -1)

          if [ -z "$CLANG_DIR" ]; then
            echo "ERROR: Android Clang toolchain was not found."
            exit 1
          fi

          echo "Using:"
          echo "$CLANG_DIR"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/$CLANG_DIR/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" --version
          "$GITHUB_WORKSPACE/$CLANG_DIR/bin/ld.lld" --version

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel + Modules
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          KERNEL_NAME="-Cyber-Holi"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          LOCALVERSION=${KERNEL_NAME}
          "

          mkdir -p out

          echo "========================================"
          echo " TOOLCHAIN "
          echo "========================================"

          clang --version
          ld.lld --version

          echo "========================================"
          echo " USING HOLI QGKI DEFCONFIG "
          echo "========================================"

          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo "========================================"
          echo " STOCK COMPATIBILITY CONFIG "
          echo "========================================"

          # --------------------------------------------------------
          # The stock kernel uses:
          #
          # CONFIG_CFI_CLANG=y
          # CONFIG_LTO=y
          # CONFIG_SHADOW_CALL_STACK=y
          # CONFIG_MODULES=y
          # CONFIG_MODVERSIONS=y
          #
          # Your uploaded defconfig differs here.
          # --------------------------------------------------------

          scripts/config --file out/.config \
            --enable CFI_CLANG \
            --enable LTO \
            --enable SHADOW_CALL_STACK \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable MODVERSIONS

          # --------------------------------------------------------
          # Keep the vendor drivers as MODULES.
          #
          # DO NOT convert these to built-in.
          # Stock device reports these as =m.
          # --------------------------------------------------------

          scripts/config --file out/.config \
            --module MSM_BT_POWER \
            --module BTFM_SLIM \
            --module QCA_CLD_WLAN \
            --module MSM_RDBG

          # --------------------------------------------------------
          # Ensure LTO is not explicitly forced to NONE.
          # --------------------------------------------------------

          scripts/config --file out/.config \
            --disable LTO_NONE

          # --------------------------------------------------------
          # Resolve dependencies.
          # --------------------------------------------------------

          make $MAKE_ARGS olddefconfig

          echo "========================================"
          echo " FINAL CONFIG CHECK "
          echo "========================================"

          grep -E \
            "CONFIG_(CFI_CLANG|LTO|LTO_CLANG|LTO_NONE|SHADOW_CALL_STACK|MODULES|MODULE_UNLOAD|MODVERSIONS|MSM_BT_POWER|BTFM_SLIM|QCA_CLD_WLAN|MSM_RDBG)=" \
            out/.config || true

          echo
          echo "========================================"
          echo " EXPECTED VENDOR DRIVERS "
          echo "========================================"

          grep -E \
            "^CONFIG_(MSM_BT_POWER|BTFM_SLIM|QCA_CLD_WLAN|MSM_RDBG)=" \
            out/.config || true

          echo
          echo "========================================"
          echo " BUILD KERNEL "
          echo "========================================"

          make -j"$(nproc)" $MAKE_ARGS \
            Image \
            modules \
            modules_prepare

          echo
          echo "========================================"
          echo " BUILD COMPLETE "
          echo "========================================"

          ls -lh out/arch/arm64/boot/Image

      # ============================================================
      # INSTALL MODULES
      #
      # Keep modules because stock device uses them.
      # ============================================================

      - name: Install Kernel Modules
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          "

          rm -rf out/modules_staging

          mkdir -p out/modules_staging

          echo "========================================"
          echo " INSTALLING MODULES "
          echo "========================================"

          make $MAKE_ARGS \
            INSTALL_MOD_PATH="$PWD/out/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "========================================"
          echo " MODULE DIRECTORY "
          echo "========================================"

          find out/modules_staging/lib/modules \
            -maxdepth 2 -type f \
            | sort

      # ============================================================
      # CHECK MODULES
      # ============================================================

      - name: Verify Modules
        run: |
          set -e

          KVER=$(find out/modules_staging/lib/modules \
            -mindepth 1 -maxdepth 1 -type d \
            -printf "%f\n" | head -1)

          if [ -z "$KVER" ]; then
            echo "ERROR: No kernel module directory generated."
            exit 1
          fi

          echo "Kernel module release:"
          echo "$KVER"

          echo
          echo "Generated modules:"

          find "out/modules_staging/lib/modules/$KVER" \
            -type f -name "*.ko" | sort

          echo
          echo "========================================"
          echo " REQUIRED MODULES "
          echo "========================================"

          for module in \
            btpower \
            bt_fm_slim \
            wlan \
            rdbg
          do
            echo "Searching for $module..."

            find "out/modules_staging/lib/modules/$KVER" \
              -type f \
              \( -name "$module.ko" \
                 -o -name "${module}_dlkm.ko" \) \
              -print
          done

      # ============================================================
      # PREPARE MODULE METADATA
      # ============================================================

      - name: Generate Module Metadata
        run: |
          set -e

          export ARCH=arm64

          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          "

          KVER=$(find out/modules_staging/lib/modules \
            -mindepth 1 -maxdepth 1 -type d \
            -printf "%f\n" | head -1)

          MODDIR="$PWD/out/modules_staging/lib/modules/$KVER"

          echo "Module directory:"
          echo "$MODDIR"

          # Generate aliases/dependencies from the built modules.
          make $MAKE_ARGS \
            INSTALL_MOD_PATH="$PWD/out/modules_staging" \
            modules_install

          echo
          echo "========================================"
          echo " MODULE METADATA "
          echo "========================================"

          ls -lah "$MODDIR"

          echo
          echo "modules.dep:"
          test -f "$MODDIR/modules.dep" && head -50 "$MODDIR/modules.dep" || true

      # ============================================================
      # PREPARE ANYKERNEL3
      #
      # NO MANUAL DTB
      # NO DTB SCRIPT
      # MODULES ARE INCLUDED
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -e

          echo "========================================"
          echo " COPY KERNEL IMAGE "
          echo "========================================"

          cp out/arch/arm64/boot/Image \
            AnyKernel3/Image

          # --------------------------------------------------------
          # Remove accidental DTB payloads.
          # We are not manually handling DTB here.
          # --------------------------------------------------------

          rm -f AnyKernel3/dtb
          rm -f AnyKernel3/dtb.img
          rm -f AnyKernel3/dt
          rm -f AnyKernel3/recovery_dtbo

          # --------------------------------------------------------
          # Remove old module directory.
          # --------------------------------------------------------

          rm -rf AnyKernel3/modules

          mkdir -p \
            AnyKernel3/modules/vendor/lib/modules

          KVER=$(find out/modules_staging/lib/modules \
            -mindepth 1 -maxdepth 1 -type d \
            -printf "%f\n" | head -1)

          MODDIR="$PWD/out/modules_staging/lib/modules/$KVER"

          echo "========================================"
          echo " COPYING MODULES "
          echo "========================================"

          find "$MODDIR" \
            -type f -name "*.ko" \
            -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          # --------------------------------------------------------
          # Copy module metadata.
          # --------------------------------------------------------

          for f in \
            modules.alias \
            modules.dep \
            modules.softdep \
            modules.load \
            modules.blocklist
          do
            if [ -f "$MODDIR/$f" ]; then
              cp "$MODDIR/$f" \
                AnyKernel3/modules/vendor/lib/modules/
            fi
          done

          echo
          echo "========================================"
          echo " MODULES IN ANYKERNEL "
          echo "========================================"

          find AnyKernel3/modules \
            -type f | sort

          echo
          echo "========================================"
          echo " MODULE SIZE "
          echo "========================================"

          du -sh AnyKernel3/modules

      # ============================================================
      # WRITE ANYKERNEL SCRIPT
      # ============================================================

      - name: Write AnyKernel Script
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## AnyKernel setup

          properties() { '
          kernel.string=CosmosKernel for OnePlus Nord CE2 Lite 5G
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=oscaro
          device.name2=OnePlus Nord CE2 Lite 5G
          device.name3=CPH2409
          device.name4=OP535DL1
          device.name5=

          supported.versions=15-17
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # Boot partition
          BLOCK=boot;
          IS_SLOT_DEVICE=1;

          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          ## AnyKernel methods
          . tools/ak3-core.sh;

          ## AnyKernel install

          dump_boot;

          # Modules are included in the ZIP.
          # Do not manually flash DTB here.
          if [ -d "$home/modules" ]; then
            ui_print " ";
            ui_print "Installing kernel modules...";
            cp -rf "$home/modules/vendor" "$SYSTEM_ROOT/";
          fi;

          write_boot;

          ## end install
          EOF

          echo "========================================"
          echo " ANYKERNEL.SH "
          echo "========================================"

          cat AnyKernel3/anykernel.sh

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify AnyKernel Package
        run: |
          set -e

          echo "========================================"
          echo " ANYKERNEL FILES "
          echo "========================================"

          find AnyKernel3 \
            -maxdepth 4 \
            -type f | sort

          echo
          echo "========================================"
          echo " IMAGE "
          echo "========================================"

          ls -lh AnyKernel3/Image

          echo
          echo "========================================"
          echo " MODULE COUNT "
          echo "========================================"

          find AnyKernel3/modules \
            -type f -name "*.ko" | wc -l

          echo
          echo "========================================"
          echo " DTB CHECK "
          echo "========================================"

          if [ -e AnyKernel3/dtb ] || \
             [ -e AnyKernel3/dtb.img ] || \
             [ -e AnyKernel3/dt ]; then
            echo "ERROR: DTB payload unexpectedly exists."
            exit 1
          fi

          echo "No manually packaged DTB."

      # ============================================================
      # PACK ZIP
      # ============================================================

      - name: Pack Kernel ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../Cyber-Holi-Kernel.zip \
            *

          cd ..

          echo "========================================"
          echo " ZIP CREATED "
          echo "========================================"

          ls -lh Cyber-Holi-Kernel.zip

      # ============================================================
      # FINAL ZIP CHECK
      # ============================================================

      - name: Verify Kernel ZIP
        run: |
          set -e

          echo "========================================"
          echo " ZIP CONTENTS "
          echo "========================================"

          unzip -l Cyber-Holi-Kernel.zip

          echo
          echo "========================================"
          echo " MODULES "
          echo "========================================"

          unzip -l Cyber-Holi-Kernel.zip \
            | grep -E '\.ko$' || true

          echo
          echo "========================================"
          echo " ZIP SIZE "
          echo "========================================"

          ls -lh Cyber-Holi-Kernel.zip

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Holi-Kernel
          path: Cyber-Holi-Kernel.zip
