name: Build Android Kernel Holi Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      - name: Clone Proton Clang + AnyKernel3
        run: |
          git clone --depth=1 \
            https://gitlab.com/LeCmnGend/proton-clang clang

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel + DTBS + Modules
        run: |
          export PATH=$PWD/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          KERNEL_NAME="-Cyber-Holi"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          LOCALVERSION=${KERNEL_NAME}
          "

          mkdir -p out

          echo "========================="
          echo " USING DEFCONFIG "
          echo "========================="

          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo "========================="
          echo " PATCH CONFIG "
          echo "========================="

          # Section mismatch warning only
          if grep -q "# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set" out/.config; then
            sed -i \
              's/# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' \
              out/.config
          else
            echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          fi

          # Enable modules
          if grep -q "# CONFIG_MODULES is not set" out/.config; then
            sed -i \
              's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/g' \
              out/.config
          fi

          # Enable module unload
          if grep -q "# CONFIG_MODULE_UNLOAD is not set" out/.config; then
            sed -i \
              's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/g' \
              out/.config
          fi

          # Disable module signature
          sed -i \
            's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' \
            out/.config

          make $MAKE_ARGS olddefconfig

          echo "========================="
          echo " VERIFY CONFIG "
          echo "========================="

          grep SECTION_MISMATCH_WARN_ONLY out/.config || true

          echo "========================="
          echo " BUILDING KERNEL "
          echo "========================="

          make -j$(nproc) $MAKE_ARGS \
            Image \
            dtbs \
            modules

      - name: Install Modules Properly
        run: |
          export PATH=$PWD/clang/bin:$PATH

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          "

          mkdir -p out/modules_staging

          make $MAKE_ARGS \
            INSTALL_MOD_PATH=$PWD/out/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "========================="
          echo " BUILT MODULES "
          echo "========================="

          find out/modules_staging -name "*.ko"

      - name: Prepare AnyKernel3
        run: |
          echo "========================="
          echo " COPYING IMAGE "
          echo "========================="

          cp out/arch/arm64/boot/Image AnyKernel3/

          echo "========================="
          echo " BUILD DTB "
          echo "========================="

          find out/arch/arm64/boot/dts/ -name "*.dtb" \
            -exec cat {} + > AnyKernel3/dtb

          echo "========================="
          echo " VERIFY DTB "
          echo "========================="

          ls -lh AnyKernel3/Image
          ls -lh AnyKernel3/dtb

          echo "========================="
          echo " COPY MODULES "
          echo "========================="

          mkdir -p AnyKernel3/modules/vendor/lib/modules/

          KVER=$(ls out/modules_staging/lib/modules/)

          # Copy only .ko files
          find out/modules_staging/lib/modules/$KVER/ -name "*.ko" \
            -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          # Copy module metadata
          cp out/modules_staging/lib/modules/$KVER/modules.* \
            AnyKernel3/modules/vendor/lib/modules/ || true

          echo "========================="
          echo " REMOVE SYMLINKS "
          echo "========================="

          find AnyKernel3 -type l -delete

          echo "========================="
          echo " STRIP MODULES "
          echo "========================="

          export PATH=$PWD/clang/bin:$PATH

          find AnyKernel3/modules/ -name "*.ko" \
            -exec llvm-strip --strip-debug {} \;

          echo "========================="
          echo " VERIFY MODULES "
          echo "========================="

          find AnyKernel3/modules -name "*.ko"

          echo "========================="
          echo " WRITE ANYKERNEL.SH "
          echo "========================="

          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=CosmosKernel for OnePlus Nord CE2 Lite 5G
          do.devicecheck=0
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=oscaro
          device.name2=OnePlus Nord CE2 Lite 5G
          device.name3=CPH2409
          device.name4=OP535DL1
          device.name5=
          supported.versions=15-16
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;

          ## AnyKernel install
          dump_boot;

          # Install DTB
          if [ -f "$home/dtb" ]; then
            ui_print " " "Installing kernel DTB...";
            flash_bootimg_fragment dtb "$home/dtb";
          else
            ui_print " " "DTB not found!";
          fi;

          # Install modules
          if [ -d "$home/modules" ]; then
            ui_print " " "Installing kernel modules...";
            cp -rf "$home/modules/vendor" "$SYSTEM_ROOT/";
          fi;

          write_boot;
          ## end install
          EOF

          echo "========================="
          echo " ANYKERNEL CONFIG "
          echo "========================="

          # Disable device check
          sed -i \
            's/do.devicecheck=1/do.devicecheck=0/g' \
            AnyKernel3/anykernel.sh

          # Enable A/B slot support
          sed -i \
            's/is_slot_device=0/is_slot_device=1/g' \
            AnyKernel3/anykernel.sh

          # Enable modules
          sed -i \
            's/do.modules=0/do.modules=1/g' \
            AnyKernel3/anykernel.sh

          # Enable systemless
          sed -i \
            's/do.systemless=0/do.systemless=1/g' \
            AnyKernel3/anykernel.sh

          echo "========================="
          echo " FINAL ANYKERNEL.SH "
          echo "========================="

          cat AnyKernel3/anykernel.sh

          echo "========================="
          echo " PACKING ZIP "
          echo "========================="

          cd AnyKernel3

          zip -r9 ../Cyber-Holi-Kernel.zip *

      - name: Verify Kernel ZIP
        run: |
          echo "========================="
          echo " KERNEL ZIP CONTENTS "
          echo "========================="

          unzip -l Cyber-Holi-Kernel.zip

          echo "========================="
          echo " ZIP SIZE "
          echo "========================="

          ls -lh Cyber-Holi-Kernel.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Holi-Kernel
          path: Cyber-Holi-Kernel.zip
