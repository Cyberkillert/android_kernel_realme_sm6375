name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev curl git zip unzip \
          python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Detect Defconfig
        run: |
          echo "Searching for DEFCONFIG in build.config files..."

          DEFCONFIG=$(grep -h "^DEFCONFIG=" build.config* 2>/dev/null | head -n1 | cut -d= -f2)

          if [ -z "$DEFCONFIG" ]; then
            echo "No DEFCONFIG found in build.config, selecting first available..."
            DEFCONFIG=$(ls arch/arm64/configs | grep defconfig | head -n1)
          fi

          echo "Detected defconfig: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

          mkdir -p out

          echo "Using defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 $DEFCONFIG

          make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/vmlinux
