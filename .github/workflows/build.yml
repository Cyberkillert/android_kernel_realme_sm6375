name: Build Lineage Kernel (KSU - GKI Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🛠 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: 🔧 Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: 📦 Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: 🔥 Setup KernelSU (Safe)
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
          mkdir -p drivers/kernelsu
          cp -r KernelSU/kernel/* drivers/kernelsu/

          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: ⚙️ Build Kernel + Modules
        run: |
          START=$(date +%s)

          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64

          CUSTOM_NAME="-KSU-Lineage-Cyber"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # ✅ Correct defconfig for LineageOS
          make "${MAKE_FLAGS[@]}" vendor/holi-gki_defconfig

          # ✅ Enable required configs
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -e MODVERSIONS
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e OVERLAY_FS

          # Disable LTO (more stable)
          ./scripts/config --file out/.config -d LTO -d LTO_CLANG -e LTO_NONE

          # Apply config
          make "${MAKE_FLAGS[@]}" olddefconfig

          # 🔨 Build kernel
          make -j$(nproc) "${MAKE_FLAGS[@]}"

          # 🔨 Build modules
          make -j$(nproc) "${MAKE_FLAGS[@]}" modules

          # 📦 Install modules
          mkdir -p modules_out
          make "${MAKE_FLAGS[@]}" modules_install INSTALL_MOD_PATH=modules_out

          echo "✅ Build + modules completed"

          END=$(date +%s)
          echo "⏱ Build took $(( ($END - $START) / 60 )) minutes"

      - name: 📦 Prepare AnyKernel3 ZIP
        run: |
          DATE=$(date +%Y%m%d)
          ZIP_NAME="Kernel-Lineage-KSU-${DATE}.zip"

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/

            cd AnyKernel3
            zip -r9 "$ZIP_NAME" *

            echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "❌ Kernel Image not found!"
            exit 1
          fi

      - name: 🚀 Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lineage-Kernel-KSU
          path: AnyKernel3/${{ env.FINAL_ZIP_NAME }}

      - name: 📂 Upload Modules (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules
          path: modules_out/
