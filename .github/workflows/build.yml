name: Build Android Kernel (Cyber-Gaming-DLKM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel and Modules
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Use an array for flags
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # --- DLKM & HARDWARE MODULE FIXES ---
          ./scripts/config --file out/.config -e MODULES
          ./scripts/config --file out/.config -d MODVERSIONS
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -d MODULE_SIG_ALL
          ./scripts/config --file out/.config -d MODULE_SIG_FORCE
          ./scripts/config --file out/.config -e MODULE_FORCE_LOAD

          # --- FAST CHARGING FIX (Realme/OPlus) ---
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHARGER_MTK
          ./scripts/config --file out/.config -e CONFIG_POWER_SUPPLY
          ./scripts/config --file out/.config -e CONFIG_QPNP_SMB5
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_TATT_SUPPORT
          ./scripts/config --file out/.config -d CONFIG_OPLUS_CHG_LITE
          
          # --- MAX PERFORMANCE & GAMING TWEAKS ---
          ./scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE
          ./scripts/config --file out/.config -d CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
          ./scripts/config --file out/.config -e CPU_FREQ_DEFAULT_GOV_PERFORMANCE
          ./scripts/config --file out/.config -e HZ_1000
          ./scripts/config --file out/.config -d HZ_300

          # Sync changes
          make "${MAKE_FLAGS[@]}" olddefconfig

          # 2. Build everything (Image + all .ko modules)
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y all

      - name: Prepare AnyKernel3 Zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            # 1. Copy Kernel
            cp out/arch/arm64/boot/Image AnyKernel3/
            
            # 2. Collect and Strip Modules for DLKM
            # We put them in vendor_dlkm folder so AnyKernel3 knows where to flash them
            mkdir -p AnyKernel3/modules/vendor_dlkm/lib/modules
            find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor_dlkm/lib/modules/ \;
            
            # Strip debug symbols to keep the zip size small
            # (Uses the cross-compiler strip tool)
            # aarch64-linux-gnu-strip --strip-debug AnyKernel3/modules/vendor_dlkm/lib/modules/*.ko
            
            # 3. Enable module support in AnyKernel3 script
            sed -i 's/do.modules=0/do.modules=1/g' AnyKernel3/anykernel.sh
            
            # 4. Zip everything
            cd AnyKernel3
            rm -f *.zip
            zip -r9 ../Kernel-Cyberkillert-Holi-DLKM.zip *
          else
            echo "FATAL: Build failed!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Gaming-DLKM-Package
          path: ./Kernel-Cyberkillert-Holi-DLKM.zip
          
