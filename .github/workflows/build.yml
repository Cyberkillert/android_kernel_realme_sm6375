name: Build Android Kernel (Cyber-NetHunter)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio binutils-aarch64-linux-gnu

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          CUSTOM_NAME="-NetHunter-Cyber"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out
          make "${MAKE_FLAGS[@]}" vendor/holi-gki_defconfig

          # NETHUNTER CONFIGURATION
          ./scripts/config --file out/.config -e USB_F_HID
          ./scripts/config --file out/.config -e USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config -e MAC80211
          ./scripts/config --file out/.config -e CFG80211
          ./scripts/config --file out/.config -e CFG80211_WEXT
          ./scripts/config --file out/.config -e RFKILL
          ./scripts/config --file out/.config -e BT_HCIUART
          ./scripts/config --file out/.config -e BT_HCIBTUSB

          # Build it
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          DATE=$(date +%Y%m%d)
          ZIP_NAME="Kernel-Cyber-NetHunter-${DATE}.zip"
          
          if [ -f out/arch/arm64/boot/Image ]; then
            # 1. Copy Kernel Image
            cp out/arch/arm64/boot/Image AnyKernel3/
            
            # 2. FIX: Include Modules (Crucial for WiFi/Camera)
            # This creates the path expected by GKI devices like yours
            mkdir -p AnyKernel3/modules/vendor/lib/modules/5.4-gki
            find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/5.4-gki/ \;
            
            # 3. FIX: AnyKernel Script Settings
            # This makes the zip work for Realme A/B slot devices
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
            sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
            sed -i 's|block=.*|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
            
            cd AnyKernel3
            zip -r9 "$ZIP_NAME" *
            mv "$ZIP_NAME" ../
            echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "FATAL: Image failed to compile!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: ./${{ env.FINAL_ZIP_NAME }}
          
