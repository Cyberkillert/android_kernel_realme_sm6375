name: Build Android Kernel (Cyber-Official-Spec)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libssl-dev libelf-dev libncurses-dev \
            python3 unzip zip cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libxml2-utils  # Required for some DTB tools

      - name: Clone Toolchain & AnyKernel
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel 5.4 (Holi GKI)
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          CUSTOM_NAME="-lineageos-Cyber-Holi"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out
          # Changed to holi_GKI.config as requested
          make "${MAKE_FLAGS[@]}" vendor/holi_GKI.config

          # --- APPLY BOARDCONFIG SPECS ---
          ./scripts/config --file out/.config -e CONFIG_ARM64_4K_PAGES
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -e CONFIG_MODULES
          ./scripts/config --file out/.config -e CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          make "${MAKE_FLAGS[@]}" olddefconfig

          # Build kernel, modules, and DTBS (Required for DTBO)
          make -j$(nproc) "${MAKE_FLAGS[@]}"
          make -j$(nproc) "${MAKE_FLAGS[@]}" modules
          make -j$(nproc) "${MAKE_FLAGS[@]}" dtbs

      - name: Install Modules to Staging
        run: |
          export PATH=$PWD/clang/bin:$PATH
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION="-lineageos-Cyber-Holi"
          )

          mkdir -p out/modules_staging
          make "${MAKE_FLAGS[@]}" \
            INSTALL_MOD_PATH=$PWD/out/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install

      - name: Prepare AnyKernel3 & DTBO
        run: |
          # Setup AnyKernel script
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/do.modules=0/do.modules=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.systemless=0/do.systemless=1/g' AnyKernel3/anykernel.sh

          # Add command line flags
          echo "cmdline=androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=4e00000.dwc3 swiotlb=0 loop.max_part=7 cgroup.memory=nokmem,nosocket iptable_raw.raw_before_defrag=1 ip6table_raw.raw_before_defrag=1 kpti=off" >> AnyKernel3/anykernel.sh

          # Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/

          # --- DTBO HANDLING ---
          # Look for dtbo.img in the output directory
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          else
            # If the build system produces individual .dtbo files, they usually need to be merged.
            # Most modern Holi kernels will output a single dtbo.img if 'make dtbs' is called.
            echo "dtbo.img not found! Searching for dtbo directory..."
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} AnyKernel3/ \;
          fi

          # Copy Modules
          mkdir -p AnyKernel3/modules/vendor/lib/modules/
          KVER=$(ls out/modules_staging/lib/modules/)
          cp -r out/modules_staging/lib/modules/$KVER/. AnyKernel3/modules/vendor/lib/modules/

          # Rename wlan alias
          if [ -f AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko ]; then
            cp AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko \
               AnyKernel3/modules/vendor/lib/modules/wlan.ko
          fi

          # Strip debug info
          export PATH=$PWD/clang/bin:$PATH
          find AnyKernel3/modules/ -name "*.ko" -exec llvm-strip --strip-debug {} \;

          cd AnyKernel3
          zip -r9 ../Cyber-Final-Holi-GKI.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Kernel-Holi-GKI
          path: ./Cyber-Final-Holi-GKI.zip
          
