name: Build Android Kernel (Cyber-Official-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libssl-dev libelf-dev libncurses-dev \
            python3 unzip zip cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libxml2-utils

      - name: Clone Toolchain & AnyKernel
        run: |
          # Use Neutron Clang (highly optimized for Snapdragon)
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel 5.4 (Holi GKI)
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          
          # Custom label for the About Phone screen
          CUSTOM_NAME="-Cyber-Holi-GKI"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out
          # Using the GKI config as requested
          make "${MAKE_FLAGS[@]}" vendor/holi_GKI.config

          # Apply mandatory Realme/GKI fixes
          ./scripts/config --file out/.config -e CONFIG_ARM64_4K_PAGES
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -e CONFIG_MODULES
          ./scripts/config --file out/.config -e CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          make "${MAKE_FLAGS[@]}" olddefconfig

          # Build Image, DTBs (for DTBO), and Modules
          make -j$(nproc) "${MAKE_FLAGS[@]}" Image dtbs modules

      - name: Install & Strip Modules
        run: |
          export PATH=$PWD/clang/bin:$PATH
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          mkdir -p out/modules_staging
          make "${MAKE_FLAGS[@]}" \
            INSTALL_MOD_PATH=$PWD/out/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install

          # Use llvm-strip from the toolchain for maximum compatibility
          find out/modules_staging -name "*.ko" -exec llvm-strip --strip-debug {} \;

      - name: Prepare AnyKernel3 Package
        run: |
          # 1. Image and DTBO
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          # 2. Kernel Modules
          mkdir -p AnyKernel3/modules/vendor/lib/modules/
          KVER=$(ls out/modules_staging/lib/modules/)
          cp -r out/modules_staging/lib/modules/$KVER/. AnyKernel3/modules/vendor/lib/modules/

          # 3. Handle WLAN alias (common for Realme SM6375)
          if [ -f AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko ]; then
             cp AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko AnyKernel3/modules/vendor/lib/modules/wlan.ko
          fi

          # 4. Configure anykernel.sh for Realme 10 Pro
          cd AnyKernel3
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          # Zip it up
          zip -r9 ../Cyber-Holi-GKI-Build.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Kernel-Holi
          path: ./Cyber-Holi-GKI-Build.zip
          
