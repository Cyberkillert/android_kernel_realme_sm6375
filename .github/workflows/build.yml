name: Build Realme SM6375 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        bc \
        bison \
        build-essential \
        ccache \
        clang \
        curl \
        flex \
        g++-multilib \
        gcc-multilib \
        git \
        gnupg \
        gperf \
        imagemagick \
        lib32ncurses5-dev \
        lib32readline-dev \
        lib32z1-dev \
        libelf-dev \
        liblz4-tool \
        libsdl1.2-dev \
        libssl-dev \
        libxml2 \
        libxml2-utils \
        lld \
        lzop \
        pngcrush \
        rsync \
        schedtool \
        squashfs-tools \
        xsltproc \
        zip \
        zlib1g-dev

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 \
        https://github.com/kdrag0n/proton-clang \
        clang

    - name: Setup KernelSU-Next
      run: |
        curl -LSs \
        "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" \
        | bash

    - name: Remove Unsupported KernelSU Features
      run: |
        rm -f drivers/kernelsu/feature/sucompat.c || true

        sed -i '/sucompat.o/d' \
        drivers/kernelsu/feature/Makefile || true

        sed -i '/sucompat/d' \
        drivers/kernelsu/feature/Kconfig || true

    - name: Enable KernelSU Config
      run: |
        echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/holi-qgki_defconfig

    - name: Build Defconfig
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        vendor/holi-qgki_defconfig

    - name: Disable Werror
      run: |
        scripts/config --file out/.config -d CC_WERROR || true

    - name: Compile Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        KCFLAGS=-Wno-error \
        CONFIG_SECTION_MISMATCH_WARN_ONLY=y

    - name: Verify Kernel Output
      run: |
        ls -lah out/arch/arm64/boot/

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3

    - name: Copy Kernel Image
      run: |
        cp out/arch/arm64/boot/Image \
        AnyKernel3/

    - name: Create Flashable ZIP
      working-directory: AnyKernel3
      run: |
        zip -r9 Realme-SM6375-KernelSU.zip *

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Realme-SM6375-KernelSU
        path: AnyKernel3/Realme-SM6375-KernelSU.zip

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: out/arch/arm64/boot/Image
