name: Build Android Kernel (Cyber-BuiltIn-5.4)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel 5.4 (All Built-In)
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          CUSTOM_NAME="-qgki-Cyber-BuiltIn"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the base defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # --- FORCE ALL MODULES TO BE BUILT-IN ---
          # This script finds every '=m' in the config and changes it to '=y'
          sed -i 's/=m/=y/g' out/.config
          
          # --- NATIVE BYPASS & ERROR FIXES ---
          ./scripts/config --file out/.config -e CONFIG_SECTION_MISMATCH_WARN_ONLY
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -d MODVERSIONS

          # --- REALME PERFORMANCE & CHARGING ---
          ./scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE
          ./scripts/config --file out/.config -e HZ_1000
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG

          # 2. Sync and Build
          # Note: 'olddefconfig' might change some '=y' back to '=m' if they HAVE to be modules
          make "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y olddefconfig
          
          # Final build (Since everything is built-in, we only need the 'Image')
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y Image

      - name: Prepare AnyKernel3 (Clean Flash)
        run: |
          # Configure for A/B Slot
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          
          # We don't need AnyKernel3 to handle modules anymore because they are INSIDE the Image
          sed -i 's/do.modules=1/do.modules=0/g' AnyKernel3/anykernel.sh

          cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          rm -rf modules/
          zip -r9 ../Cyber-BuiltIn-Holi.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-BuiltIn-Kernel
          path: ./Cyber-BuiltIn-Holi.zip
          
