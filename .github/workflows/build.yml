name: Build Android GKI Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex build-essential libssl-dev curl python3

      - name: Clone kernel
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android-5.10 kernel

      - name: Clone build system
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/build build

      - name: Clone clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/clang-r*/bin:$PATH
          cd kernel
          ../build/build.sh
