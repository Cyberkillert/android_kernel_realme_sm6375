name: Build Android Kernel (KSU-Next)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ksu-next # Ensures it builds from this branch

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Setup KernelSU-Next
        run: |
          # This script automatically patches your kernel source to include KSU-Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          mkdir -p out

          # 1. Load the base defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. Force-enable KSU and required dependencies in the .config file
          # This is better than editing the defconfig file manually!
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e KPROBES_ON_FTRACE
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e KERNELSU
          
          # 3. Final build command
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 Kernel-KSU-Next.zip *
          else
            echo "Build failed: Image not found."
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-KSU-Next
          path: AnyKernel3/Kernel-KSU-Next.zip
