name: Build RMX3660 Kernel (SM6375)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu curl git zip unzip python3

      - name: Download AOSP Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          # Using Clang r450784d which is the standard for SM6375 Android 12/13
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -C $GITHUB_WORKSPACE/clang -xzf clang-r450784d.tar.gz

      - name: Build Kernel
        run: |
          # Add Clang to PATH to provide 'ld.lld'
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          
          # 1. Generate the base GKI config
          make O=out gki_defconfig
          
          # 2. Merge the Realme/Oplus vendor configuration
          # For SM6375 (Holi), the specific target is usually holi.config
          scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/holi.config
          
          # 3. Build the kernel
          make O=out -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RMX3660-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
            
