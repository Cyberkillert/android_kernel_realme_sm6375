      - name: Setup KernelSU-Next (Manual Integration)
        run: |
          # 1. Clone the driver
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          
          # 2. Move the kernel driver into the drivers directory
          mkdir -p drivers/KernelSU-Next
          cp -r KernelSU-Next/kernel/* drivers/KernelSU-Next/
          
          # 3. Add it to the drivers Makefile correctly
          echo "obj-y += KernelSU-Next/" >> drivers/Makefile
          
          echo "KernelSU-Next integrated into drivers/ successfully."

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Version string for "About Phone"
          CUSTOM_NAME="-KSU-Next-cyber"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. Force-enable the required configs
          # Note: We use the full path to scripts/config
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e KPROBES_ON_FTRACE
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e KERNELSU
          
          # 3. Build it
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          
