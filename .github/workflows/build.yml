name: Build Android Kernel Holi Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            unzip \
            zip \
            cpio \
            rsync \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      # ============================================================
      # CLANG + ANYKERNEL3
      # ============================================================

      - name: Clone Proton Clang + AnyKernel3
        run: |
          git clone --depth=1 \
            https://gitlab.com/LeCmnGend/proton-clang clang

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        run: |
          set -e

          export PATH=$PWD/clang/bin:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          KERNEL_NAME="-Cyber-Holi"

          MAKE_ARGS="
          ARCH=arm64
          O=out
          CC=clang
          LLVM=1
          LLVM_IAS=1
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          LOCALVERSION=${KERNEL_NAME}
          "

          mkdir -p out

          echo "========================================"
          echo " USING DEFCONFIG "
          echo "========================================"

          make $MAKE_ARGS vendor/holi-qgki_defconfig

          echo "========================================"
          echo " PATCHING KERNEL CONFIG "
          echo "========================================"

          # --------------------------------------------------------
          # Section mismatch warning only
          # --------------------------------------------------------

          if grep -q "^# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set" out/.config; then
            sed -i \
              's/^# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/' \
              out/.config
          elif ! grep -q "^CONFIG_SECTION_MISMATCH_WARN_ONLY=" out/.config; then
            echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          fi

          # --------------------------------------------------------
          # IMPORTANT:
          # Disable kernel module support.
          #
          # This means drivers that were configured as modules
          # must be built into the kernel instead.
          # --------------------------------------------------------

          if grep -q "^CONFIG_MODULES=" out/.config; then
            sed -i \
              's/^CONFIG_MODULES=.*/# CONFIG_MODULES is not set/' \
              out/.config
          else
            echo "# CONFIG_MODULES is not set" >> out/.config
          fi

          # --------------------------------------------------------
          # Convert EVERY existing =m option to =y
          #
          # Example:
          #
          # CONFIG_BT=m
          # becomes
          # CONFIG_BT=y
          #
          # CONFIG_SENSOR=m
          # becomes
          # CONFIG_SENSOR=y
          #
          # This is the important part for avoiding external .ko
          # dependencies.
          # --------------------------------------------------------

          sed -i \
            -E 's/^(CONFIG_[A-Za-z0-9_]+)=m$/\1=y/' \
            out/.config

          # --------------------------------------------------------
          # Disable module signing because modules are not being used
          # --------------------------------------------------------

          sed -i \
            -E 's/^CONFIG_MODULE_SIG=.*/# CONFIG_MODULE_SIG is not set/' \
            out/.config

          sed -i \
            -E 's/^CONFIG_MODULE_SIG_FORCE=.*/# CONFIG_MODULE_SIG_FORCE is not set/' \
            out/.config

          # --------------------------------------------------------
          # Resolve dependencies
          # --------------------------------------------------------

          make $MAKE_ARGS olddefconfig

          echo "========================================"
          echo " VERIFYING MODULE CONFIGURATION "
          echo "========================================"

          echo "CONFIG_MODULES:"
          grep "^CONFIG_MODULES" out/.config || true

          echo
          echo "Remaining module (=m) options:"
          grep "=m$" out/.config || true

          # --------------------------------------------------------
          # If any module remains, fail the build.
          #
          # This prevents producing a kernel that still depends on
          # external .ko files.
          # --------------------------------------------------------

          if grep -q "=m$" out/.config; then
            echo
            echo "ERROR: Kernel still contains module (=m) options!"
            echo
            grep "=m$" out/.config
            exit 1
          fi

          echo
          echo "SUCCESS: No external kernel modules configured."

          echo "========================================"
          echo " BUILDING KERNEL IMAGE "
          echo "========================================"

          make -j$(nproc) $MAKE_ARGS Image

          echo "========================================"
          echo " VERIFY KERNEL IMAGE "
          echo "========================================"

          ls -lh out/arch/arm64/boot/Image

      # ============================================================
      # PREPARE ANYKERNEL3
      #
      # NO DTB
      # NO MODULES
      # ONLY KERNEL IMAGE
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -e

          echo "========================================"
          echo " COPYING KERNEL IMAGE "
          echo "========================================"

          cp out/arch/arm64/boot/Image AnyKernel3/Image

          echo "========================================"
          echo " VERIFY IMAGE "
          echo "========================================"

          ls -lh AnyKernel3/Image

          # --------------------------------------------------------
          # Remove DTB if the cloned AnyKernel3 directory contains
          # one from a template or previous build.
          # --------------------------------------------------------

          rm -f AnyKernel3/dtb
          rm -f AnyKernel3/dtb.img
          rm -f AnyKernel3/dt
          rm -f AnyKernel3/recovery_dtbo

          # --------------------------------------------------------
          # Remove module directories completely.
          # --------------------------------------------------------

          rm -rf AnyKernel3/modules

          # --------------------------------------------------------
          # Remove old generated partition setup directories.
          # --------------------------------------------------------

          rm -rf AnyKernel3/boot-files
          rm -rf AnyKernel3/vendor_boot-files
          rm -rf AnyKernel3/vendor_kernel_boot-files
          rm -rf AnyKernel3/init_boot-files

          echo "========================================"
          echo " WRITING ANYKERNEL.SH "
          echo "========================================"

          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          ## AnyKernel setup

          # begin properties
          properties() { '
          kernel.string=CosmosKernel for OnePlus Nord CE2 Lite 5G
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=oscaro
          device.name2=OnePlus Nord CE2 Lite 5G
          device.name3=CPH2409
          device.name4=OP535DL1
          device.name5=

          supported.versions=15-17
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ## Boot partition

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          ## AnyKernel methods
          # import patching functions/variables
          . tools/ak3-core.sh;

          ## AnyKernel install

          dump_boot;

          write_boot;

          ## end install
          EOF

          echo "========================================"
          echo " FINAL ANYKERNEL.SH "
          echo "========================================"

          cat AnyKernel3/anykernel.sh

          echo "========================================"
          echo " VERIFY NO DTB / MODULES "
          echo "========================================"

          if [ -e AnyKernel3/dtb ] || \
             [ -e AnyKernel3/dtb.img ] || \
             [ -e AnyKernel3/dt ]; then
            echo "ERROR: DTB file still exists!"
            exit 1
          fi

          if [ -d AnyKernel3/modules ]; then
            echo "ERROR: modules directory still exists!"
            exit 1
          fi

          echo "No DTB included."
          echo "No external modules included."

          echo "========================================"
          echo " PACKING ZIP "
          echo "========================================"

          cd AnyKernel3

          zip -r9 ../Cyber-Holi-Kernel.zip *

      # ============================================================
      # VERIFY ZIP
      # ============================================================

      - name: Verify Kernel ZIP
        run: |
          set -e

          echo "========================================"
          echo " KERNEL ZIP CONTENTS "
          echo "========================================"

          unzip -l Cyber-Holi-Kernel.zip

          echo "========================================"
          echo " CHECK FOR DTB "
          echo "========================================"

          if unzip -l Cyber-Holi-Kernel.zip | \
             grep -E '(^|/)(dtb|dtb\.img|dt|recovery_dtbo)$'; then

            echo "ERROR: DTB found in ZIP!"
            exit 1
          fi

          echo "No DTB in ZIP."

          echo "========================================"
          echo " CHECK FOR EXTERNAL MODULES "
          echo "========================================"

          if unzip -l Cyber-Holi-Kernel.zip | \
             grep -E '\.ko$'; then

            echo "ERROR: External .ko modules found in ZIP!"
            exit 1
          fi

          echo "No external .ko modules."

          echo "========================================"
          echo " ZIP SIZE "
          echo "========================================"

          ls -lh Cyber-Holi-Kernel.zip

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Holi-Kernel
          path: Cyber-Holi-Kernel.zip
