name: Build 5.4 QGKI KernelSU SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        bc \
        bison \
        build-essential \
        ccache \
        clang \
        curl \
        flex \
        g++-multilib \
        gcc-multilib \
        git \
        gnupg \
        gperf \
        imagemagick \
        lib32ncurses5-dev \
        lib32readline-dev \
        lib32z1-dev \
        libelf-dev \
        liblz4-tool \
        libsdl1.2-dev \
        libssl-dev \
        libxml2 \
        libxml2-utils \
        lld \
        lzop \
        pngcrush \
        rsync \
        schedtool \
        squashfs-tools \
        xsltproc \
        zip \
        zlib1g-dev

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 \
        https://github.com/kdrag0n/proton-clang \
        clang

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 \
        https://github.com/LineageOS/android_kernel_realme_sm6375 \
        -b lineage-23.0 \
        kernel

    - name: Add KernelSU-Next
      working-directory: kernel
      run: |
        curl -LSs \
        "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
        | bash -s next

    - name: Clone SUSFS
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs

    - name: Apply SUSFS 5.4 Patches
      working-directory: kernel
      run: |
        cp ../susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch .

        git apply --reject --whitespace=fix \
        50_add_susfs_in_kernel-5.4.patch || true

    - name: Enable KernelSU
      working-directory: kernel
      run: |
        echo "CONFIG_KSU=y" \
        >> arch/arm64/configs/vendor/holi-qgki_defconfig

        echo "CONFIG_KSU_SUSFS=y" \
        >> arch/arm64/configs/vendor/holi-qgki_defconfig

    - name: Build Defconfig
      working-directory: kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out \
        ARCH=arm64 \
        LLVM=1 \
        vendor/holi-qgki_defconfig

    - name: Compile Kernel
      working-directory: kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        LLVM=1

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3

    - name: Copy Kernel
      run: |
        cp kernel/out/arch/arm64/boot/Image \
        AnyKernel3/

    - name: Create ZIP
      working-directory: AnyKernel3
      run: |
        zip -r9 KernelSU-SUSFS-5.4.zip *

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-SUSFS-5.4
        path: AnyKernel3/KernelSU-SUSFS-5.4.zip
