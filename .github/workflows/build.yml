name: Build RMX3660 Kernel (SM6375)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex build-essential \
          libssl-dev libelf-dev \
          clang lld llvm \
          curl git zip unzip python3

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          # Clean previous build
          make O=out clean

          # If you have custom config like realme_sm6375_defconfig
          # replace defconfig below with that name
          make O=out defconfig

          # Build using all cores
          make O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: RMX3660-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
