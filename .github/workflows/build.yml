name: Build Android Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Setup KernelSU-Next (Manual Integration)
        run: |
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          mkdir -p drivers/ksu
          cp -r KernelSU-Next/kernel/* drivers/ksu/
          if ! grep -q "obj-y += ksu/" drivers/Makefile; then
            echo "obj-y += ksu/" >> drivers/Makefile
          fi
          echo "KernelSU-Next integrated successfully."

      - name: Setup SUSFS
        run: |
          # Use a verified public mirror for SUSFS patches
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git susfs_repo
          
          # Copy core SUSFS files to your source
          find susfs_repo -name "susfs.h" -exec cp {} include/linux/ \;
          find susfs_repo -name "susfs.c" -exec cp {} fs/ \;
          
          # Link SUSFS in the filesystem Makefile
          if ! grep -q "susfs.o" fs/Makefile; then
            sed -i '/obj-y += open.o/a obj-y += susfs.o' fs/Makefile
          fi
          echo "SUSFS integrated successfully."

      - name: Build Kernel
        run: |
          START=$(date +%s)
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Internal kernel name
          CUSTOM_NAME="-KSU-Next-SUSFS-Cyber"
          
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # DISABLE LTO for stability
          ./scripts/config --file out/.config -d LTO -d LTO_CLANG -e LTO_NONE
          
          # Enable KSU & SUSFS Configs
          ./scripts/config --file out/.config -e KPROBES -e OVERLAY_FS -e KERNELSU
          ./scripts/config --file out/.config -e SUSFS -e SUSFS_HIDE_KSU -e SUSFS_TRY_UMOUNT

          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          
          END=$(date +%s)
          echo "Build took $(( ($END - $START) / 60 )) minutes."

      - name: Prepare AnyKernel3 Zip
        run: |
          DATE=$(date +%Y%m%d)
          # Filename using Cyber
          ZIP_NAME="Kernel-Cyber-KSU-SUSFS-${DATE}.zip"
          
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 "$ZIP_NAME" *
            # Move zip to root to avoid nested folders in artifact
            mv "$ZIP_NAME" ../
            echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "Error: Image file not found!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          # Setting the artifact name to the filename avoids the extra zip layer
          name: ${{ env.FINAL_ZIP_NAME }}
          path: ./${{ env.FINAL_ZIP_NAME }}
          
