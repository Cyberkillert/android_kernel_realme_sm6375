- name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR=$PWD/out
          export DIST_DIR=$PWD/dist
          export PATH=$PWD/clang/clang-r*/bin:$PATH

          cd kernel

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          OUT_DIR=$OUT_DIR \
          DIST_DIR=$DIST_DIR \
          ../build/build.sh

          - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-image
          path: dist/Image
