name: Build Android Kernel (KSU-Next)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Setup KernelSU-Next (Manual)
        run: |
          # 2026 Stable Manual Integration:
          # Clone the Next driver directly into your kernel folder
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          
          # Link the driver into the kernel build system
          echo "obj-y += KernelSU-Next/kernel/" >> drivers/Makefile
          echo "KernelSU-Next integrated successfully."

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # This name shows up in About Phone
          CUSTOM_NAME="-KSU-Next-cyber"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. Force-enable the required configs
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e KPROBES_ON_FTRACE
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e KERNELSU
          
          # 3. Build the kernel
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          # Create a date variable (Format: YYYYMMDD)
          DATE=$(date +%Y%m%d)
          ZIP_NAME="Kernel-cyber-KSU-${DATE}.zip"
          
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            zip -r9 "$ZIP_NAME" *
            # Export filename for the next step
            echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          else
            echo "Error: Image file not found!"
            exit 1
          fi

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-KSU-Next-Build
          path: AnyKernel3/${{ env.FINAL_ZIP_NAME }}
          
