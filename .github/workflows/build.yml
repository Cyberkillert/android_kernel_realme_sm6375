name: Build Android Kernel (Cyber-Realme-5.4-Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel 5.4 (Oplus-Native Fix)
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Match your working version string
          CUSTOM_NAME="-qgki-Cyber-Native"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
            LOCALVERSION=$CUSTOM_NAME
          )

          mkdir -p out

          # 1. Load the defconfig (Uses the Makefile you provided)
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # --- NATIVE MODULE BYPASS ---
          # These flags allow your hardware modules to load without Magisk
          ./scripts/config --file out/.config -d MODULE_SIG
          ./scripts/config --file out/.config -d MODULE_SIG_ALL
          ./scripts/config --file out/.config -d MODULE_SIG_FORCE
          ./scripts/config --file out/.config -d MODVERSIONS
          ./scripts/config --file out/.config -e MODULE_FORCE_LOAD
          
          # --- FATAL ERROR BYPASS ---
          ./scripts/config --file out/.config -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          # --- REALME GAMING & CHARGING ---
          ./scripts/config --file out/.config -e CPU_FREQ_GOV_PERFORMANCE
          ./scripts/config --file out/.config -e HZ_1000
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_OPLUS_FEATURE_FEEDBACK

          # Sync config
          make "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y olddefconfig

          # 2. Build Everything (Image + .ko modules)
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y all

      - name: Prepare AnyKernel3 (Physical DLKM Injection)
        run: |
          # Configure AnyKernel3 for Realme A/B Slot
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.modules=0/do.modules=1/g' AnyKernel3/anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh

          # Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Collect and Strip Modules for DLKM
          mkdir -p AnyKernel3/modules/vendor_dlkm/lib/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor_dlkm/lib/modules/ \;
          
          # Strip symbols (Prevents "Invalid Format" errors on 5.4 kernels)
          find AnyKernel3/modules/ -name "*.ko" -exec aarch64-linux-gnu-strip --strip-debug {} \;

          cd AnyKernel3
          zip -r9 ../Cyber-Final-Native-5.4.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Kernel-Final
          path: ./Cyber-Final-Native-5.4.zip
          
