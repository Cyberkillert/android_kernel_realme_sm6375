name: Build Realme SM6375 Kernel

on:
  workflow_dispatch: # Allows you to start the build manually

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev python3 unzip zip cpio

      - name: Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone Kernel Source
        run: |
          # Replace with your actual kernel repo link
          git clone --depth=1 https://github.com/Cyberkillert/android_kernel_realme_sm6375 kernel

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          cd kernel
          
          # Build Flags
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          # 1. Load Defconfig (Match your BoardConfigCommon.mk)
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig

          # 2. Build the Kernel and Techpack Modules
          make -j$(nproc) "${MAKE_FLAGS[@]}" all

      - name: Package with AnyKernel3
        run: |
          # 1. Copy Kernel Image
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          
          # 2. Collect Modules (Wi-Fi/Camera/Audio)
          mkdir -p AnyKernel3/modules/vendor/lib/modules/5.4-gki
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/5.4-gki/ \;
          
          # 3. Strip Symbols (Reduces size)
          find AnyKernel3/modules -name "*.ko" -exec aarch64-linux-gnu-strip --strip-debug {} \;

          cd AnyKernel3
          zip -r9 ../Cyber-Kernel-SM6375.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Kernel-SM6375
          path: ./Cyber-Kernel-SM6375.zip
          
