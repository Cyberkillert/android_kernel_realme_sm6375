name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Using latest for better performance

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🛠 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libelf-dev libncurses-dev \
            python3 unzip zip wget lld llvm

      - name: ⚙️ Setup Toolchain (Prebuilt Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Using a prebuilt AOSP Clang to save hours of build time
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522830.tar.gz
          tar -xf clang-r522830.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: 🌱 Set Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=cyber" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github" >> $GITHUB_ENV

      - name: ⚙️ Load Defconfig
        run: |
          # Added CC=clang here to ensure the config is generated for the right compiler
          make O=out ARCH=arm64 CC=clang vendor/holi-qgki_defconfig

      - name: 🔨 Build Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: 📦 Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image*
