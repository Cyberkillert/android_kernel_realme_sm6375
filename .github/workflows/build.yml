name: Build Luigi Kernel And Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel
        run: |
          set -e

          git clone \
            https://github.com/Cyberkillert/android_kernel_realme_sm6375.git \
            kernel

          cd kernel

          git checkout 84e7d691ee3a094de68628c488847a4dd632e7eb

          echo "===== COMMIT ====="
          git log -1 --oneline

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            rsync \
            cpio \
            zip \
            unzip

      - name: Check Build Configuration
        run: |
          cd kernel

          echo "===== BUILD CONFIGS ====="

          ls -1 build.config*

          echo
          echo "===== MSM COMMON ====="

          cat build.config.msm.common

          echo
          echo "===== AARCH64 ====="

          cat build.config.aarch64

          echo
          echo "===== MODULE LIST ====="

          cat modules.list.msm.lahaina

      - name: Find Device Config
        run: |
          cd kernel

          echo "===== DEFCONFIGS ====="

          find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | sort

          echo
          echo "===== HOLI/QGKI/SM6375 REFERENCES ====="

          grep -RniE \
            "holi|qgki|sm6375|lahaina|luigi" \
            arch/arm64/configs \
            2>/dev/null \
            | head -100 || true

      - name: Prepare Kernel Configuration
        run: |
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LD=ld.lld

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== TOOLCHAIN ====="

          clang --version
          ld.lld --version

          echo
          echo "===== USING EXISTING DEVICE DEFCONFIG ====="

          DEFCONFIG=$(find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | grep -Ei "holi|qgki|sm6375|lahaina|luigi" \
            | head -1 || true)

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Device defconfig not found."
            exit 1
          fi

          echo "Found:"
          echo "$DEFCONFIG"

          DEFCONFIG_NAME=$(basename "$DEFCONFIG" .config)

          echo
          echo "Defconfig:"
          echo "$DEFCONFIG_NAME"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG_NAME"

          echo
          echo "===== CONFIGURATION ====="

          grep -E \
            'CONFIG_(MODULES|MODVERSIONS|CFI_CLANG|LTO|LTO_CLANG|LTO_NONE|SHADOW_CALL_STACK|STACKPROTECTOR|QCA_CLD_WLAN|MSM_BT_POWER|BTFM_SLIM|MSM_RDBG)=' \
            out/.config \
            || true

      - name: Build Kernel
        run: |
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LD=ld.lld

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "===== BUILD KERNEL ====="

          make -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image \
            modules

      - name: Install Modules
        run: |
          cd kernel

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          rm -rf modules_out

          mkdir -p modules_out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            INSTALL_MOD_PATH="$PWD/modules_out" \
            INSTALL_MOD_STRIP=1 \
            modules_install

      - name: Generate Module Metadata
        run: |
          cd kernel

          KVER=$(find modules_out/lib/modules \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" \
            | head -1)

          echo "KERNEL RELEASE:"
          echo "$KVER"

          MODDIR="modules_out/lib/modules/$KVER"

          echo
          echo "===== MODULES ====="

          find "$MODDIR" \
            -type f \
            -name "*.ko" \
            | sort

          echo
          echo "===== METADATA ====="

          ls -lah "$MODDIR"

          echo
          echo "===== IMPORTANT MODULES ====="

          find "$MODDIR" \
            -type f \
            \( \
              -iname "*wlan*.ko" \
              -o -iname "*qca*.ko" \
              -o -iname "*bt*.ko" \
              -o -iname "*camera*.ko" \
              -o -iname "*sensor*.ko" \
            \) \
            -print

      - name: Verify Module ABI
        run: |
          cd kernel

          KVER=$(find modules_out/lib/modules \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" \
            | head -1)

          MODDIR="modules_out/lib/modules/$KVER"

          echo "===== KERNEL RELEASE ====="
          cat out/include/config/kernel.release 2>/dev/null || true

          echo
          echo "===== MODULE VERMAGIC ====="

          find "$MODDIR" \
            -type f \
            -name "*.ko" \
            | while read module; do
                echo
                echo "----- $module -----"
                modinfo "$module" 2>/dev/null \
                  | grep -E "^(name|depends|vermagic):" \
                  || true
              done

      - name: Prepare Artifact
        run: |
          cd kernel

          mkdir -p ../artifact

          cp out/arch/arm64/boot/Image \
            ../artifact/Image

          KVER=$(find modules_out/lib/modules \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" \
            | head -1)

          mkdir -p \
            ../artifact/vendor/lib/modules

          cp -a \
            "modules_out/lib/modules/$KVER/." \
            ../artifact/vendor/lib/modules/

          cd ../artifact

          zip -r9 \
            ../Cyber-Holi-Kernel-Build.zip \
            .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Holi-Kernel-Build
          path: Cyber-Holi-Kernel-Build.zip
