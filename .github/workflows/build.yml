name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential flex git curl \
          libssl-dev libelf-dev libncurses-dev \
          python3 unzip zip cpio

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Build Kernel
        run: |
          # Setup toolchain path
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Use an array for flags to keep things clean
          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KBUILD_MODPOST_WARN=1
          )

          mkdir -p out

          # 1. Load the defconfig
          make "${MAKE_FLAGS[@]}" vendor/holi-qgki_defconfig
          # --- FIX FAST CHARGING (OPlus/Realme Handshake) ---
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHARGER_MTK
          ./scripts/config --file out/.config -e CONFIG_OPLUS_SHORT_HW_CHECK
          ./scripts/config --file out/.config -e CONFIG_OPLUS_SMART_CHARGER
          
          # Enable Power Supply Class (Needed for OS to see Fast Charge)
          ./scripts/config --file out/.config -e CONFIG_POWER_SUPPLY
          ./scripts/config --file out/.config -e CONFIG_QPNP_SMB5
          ./scripts/config --file out/.config -e CONFIG_SMB1390_CHARGE_PUMP
                    # Raise the thermal limit for charging (Caution: Phone will get hot!)
          ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_TATT_SUPPORT
          ./scripts/config --file out/.config -d CONFIG_OPLUS_CHG_LITE

          # 2. Build the kernel (Injecting mismatch bypass here)
          make -j$(nproc) "${MAKE_FLAGS[@]}" CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Prepare AnyKernel3 Zip
        run: |
          # Verify image existence
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
            cd AnyKernel3
            # Remove any existing zips before creating a new one
            rm -f *.zip
            zip -r9 Kernel-holi.zip *
          else
            echo "FATAL: Kernel Image (vmlinux) failed to compile!"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel
          path: AnyKernel3/Kernel-holi.zip

          
