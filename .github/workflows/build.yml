name: Build Android Kernel

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:

- name: Checkout source
  uses: actions/checkout@v4

- name: Install dependencies
  run: |
    sudo apt update
    sudo apt install -y bc bison build-essential flex git curl \
    libssl-dev libelf-dev libncurses-dev python3 unzip zip cpio

- name: Clone Proton Clang
  run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

- name: Clone AnyKernel3
  run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3

- name: Build Kernel
  run: |
    export ARCH=arm64
    export SUBARCH=arm64
    export PATH=$PWD/clang/bin:$PATH

    mkdir -p out

    # Confirm file exists
    ls arch/arm64/configs/vendor/

    # Load defconfig (correct)
    make O=out ARCH=arm64 vendor/holi-qgki_defconfig

    # Build
    make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1

- name: Make Flashable Zip
  run: |
    cp out/arch/arm64/boot/Image AnyKernel3/
    cd AnyKernel3
    zip -r9 Kernel-holi.zip *

- name: Upload Outputs
  uses: actions/upload-artifact@v4
  with:
    name: Kernel-Build
    path: |
      out/arch/arm64/boot/Image
      AnyKernel3/Kernel-holi.zip
