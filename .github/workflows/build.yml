name: Build kernels

on:
  workflow_dispatch:

jobs:
  Set_repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Matrix
        id: set-matrix
        run: |
          if [ ! -f repos.json ]; then
            echo "Error: repos.json file not found in the repository root!"
            exit 1
          fi
          JSON=$(cat repos.json | tr -d '\n' | tr -d ' ')
          echo "matrix=${JSON}" >> $GITHUB_OUTPUT

  Build-Kernel:
    needs: Set_repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.Set_repos.outputs.matrix) }}
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Create Working Directory
        run: mkdir -p workdir

      - name: Install Prerequisites
        run: |
          sudo apt update
          sudo apt install -y curl git make binutils bc bison flex python3 zip unzip cpio tar findutils sed grep coreutils kmod libssl-dev build-essential ccache jq libelf-dev

      - name: Clone Kernel Source
        run: |
          git clone -b ${{ matrix.kernelSource.branch }} ${{ matrix.kernelSource.repo }} workdir/kernel_workspace

      - name: Download Toolchains
        run: |
          cd workdir
          mkdir -p toolchains
          echo '${{ toJSON(matrix.toolchains) }}' > toolchains.json
          jq -c '.[]' toolchains.json | while read -r toolchain; do
            REPO=$(echo "$toolchain" | jq -r '.repo')
            BRANCH=$(echo "$toolchain" | jq -r '.branch')
            NAME=$(echo "$toolchain" | jq -r '.name')
            echo "Cloning toolchain: $NAME from $REPO [$BRANCH]..."
            git clone -b "$BRANCH" --depth=1 "$REPO" "toolchains/$NAME"
          done

      - name: Update KernelSU Next & Apply Manual Hooks
        if: ${{ matrix.withKernelSU == true }}
        run: |
          cd workdir/kernel_workspace
          
          echo "Injecting KernelSU Next (Legacy branch)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          echo "Downloading automated system call hook patchset..."
          curl -O https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          
          echo "Injecting mandatory config flags into defconfig..."
          TARGET_CONFIG="arch/arm64/configs/${{ matrix.kernelSource.defconfig }}"
          echo "CONFIG_KSU=y" >> "$TARGET_CONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$TARGET_CONFIG"
          
          echo "Applying legacy compiler compatibility fix (bcmp -> memcmp)..."
          if [ -f scripts/kconfig/confdata.c ]; then
            sed -i 's/bcmp/memcmp/g' scripts/kconfig/confdata.c
          fi
          
          echo "Applying WALT header return type fix..."
          if [ -f kernel/sched/walt/walt.h ]; then
            sed -i 's/static inline int cpu_boost_init(void) { }/static inline int cpu_boost_init(void) { return 0; }/g' kernel/sched/walt/walt.h
            sed -i 's/static inline int cpu_boost_init(void) {}/static inline int cpu_boost_init(void) { return 0; }/g' kernel/sched/walt/walt.h
          fi
          
          echo "Applying dummy NOHZ_KICK_MASK fix for WALT scheduler (qc_vas.c)..."
          if [ -f kernel/sched/walt/qc_vas.c ]; then
            cat << 'EOF' > patch_nohz.h
          #include <linux/atomic.h>
          #ifndef NOHZ_KICK_MASK
          #define NOHZ_KICK_MASK 0
          static atomic_t dummy_nohz_flags = ATOMIC_INIT(0);
          #define nohz_flags(cpu) (&dummy_nohz_flags)
          #endif
          EOF
            cat patch_nohz.h kernel/sched/walt/qc_vas.c > temp_qc.c && mv temp_qc.c kernel/sched/walt/qc_vas.c
            rm patch_nohz.h
          fi

          echo "Applying EAS sched_energy_present fix for fair.c..."
          if [ -f kernel/sched/fair.c ]; then
            sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c
            sed -i 's/static_branch_likely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c
          fi
          
          echo "Applying nuclear bypass to buggy Qualcomm RMNET SHS driver..."
          if [ -d techpack/datarmnet-ext/shs ]; then
            rm -rf techpack/datarmnet-ext/shs
            mkdir -p techpack/datarmnet-ext/shs
            echo "obj- := " > techpack/datarmnet-ext/shs/Makefile
          fi
          if [ -f techpack/datarmnet-ext/Makefile ]; then
            sed -i 's/obj-y += shs\// /g' techpack/datarmnet-ext/Makefile
            sed -i 's/obj-$(CONFIG_RMNET_SHS) += shs\// /g' techpack/datarmnet-ext/Makefile
          fi

      - name: Set Toolchain Path Environmental Variables
        run: |
          find $GITHUB_WORKSPACE/workdir/toolchains -type d -name "bin" | while read -r bin_path; do
            echo "$bin_path" >> $GITHUB_PATH
          done

      - name: Compile Android Kernel
        run: |
          cd workdir/kernel_workspace
          
          export ARCH=${{ matrix.params.ARCH }}
          export CROSS_COMPILE=${{ matrix.params.CROSS_COMPILE }}
          export CROSS_COMPILE_ARM32=${{ matrix.params.CROSS_COMPILE_ARM32 }}
          export CLANG_TRIPLE=${{ matrix.params.CLANG_TRIPLE }}
          export CC=${{ matrix.params.CC }}
          
          echo "Generating base configuration file..."
          make O=out ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 ${{ matrix.kernelSource.defconfig }}
          
          echo "Resolving missing configuration options non-interactively..."
          make O=out ARCH=$ARCH CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          
          echo "Generating SELinux headers natively via Python to bypass host GCC conflicts..."
          mkdir -p security/selinux/include
          cat << 'EOF' > gen_selinux.py
          import re
          with open("security/selinux/include/classmap.h", "r") as f:
              content = f.read()
          content = re.sub(r'/\*.*?\*/', '', content, flags=re.DOTALL)
          content = re.sub(r'//.*', '', content)
          matches = re.findall(r'\{\s*"(\w+)"\s*,\s*\{([^}]+)\}', content)
          with open("security/selinux/include/flask.h", "w") as f_flask, open("security/selinux/include/av_permissions.h", "w") as f_av:
              f_flask.write("#ifndef _SELINUX_FLASK_H_\n#define _SELINUX_FLASK_H_\n")
              f_av.write("#ifndef _SELINUX_AV_PERMISSIONS_H_\n#define _SELINUX_AV_PERMISSIONS_H_\n")
              for i, (cls, perms_str) in enumerate(matches, 1):
                  cls_upper = cls.upper()
                  f_flask.write(f"#define SECCLASS_{cls_upper} {i}\n")
                  perms = re.findall(r'"(\w+)"', perms_str)
                  for j, perm in enumerate(perms):
                      f_av.write(f"#define {cls_upper}__{perm.upper()} (1UL << {j})\n")
              f_flask.write("#endif\n")
              f_av.write("#endif\n")
          EOF
          python3 gen_selinux.py
          
          echo "Mirroring generated headers to out/ tree..."
          mkdir -p out/security/selinux/include
          cp security/selinux/include/flask.h out/security/selinux/include/ || true
          cp security/selinux/include/av_permissions.h out/security/selinux/include/ || true
          
          echo "Injecting SELinux include paths and defining missing macros into KernelSU Makefiles..."
          find drivers/kernelsu -name "Makefile" -exec sh -c 'echo "ccflags-y += -I\$(srctree)/security/selinux/include -I\$(objtree)/security/selinux/include -DSECINITSID_NUM=27 -DCONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9" >> "{}"' \;
          
          echo "Starting final heavy kernel build..."
          make -j$(nproc --all) O=out ARCH=$ARCH CC=$CC LLVM=1 LLVM_IAS=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Compiled Flashable Images
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.kernelSource.name }}-${{ matrix.kernelSource.device }}
          path: |
            workdir/kernel_workspace/out/arch/arm64/boot/Image
            workdir/kernel_workspace/out/arch/arm64/boot/Image.gz
            workdir/kernel_workspace/out/arch/arm64/boot/dtb
            workdir/kernel_workspace/out/arch/arm64/boot/dtbo.img
          if-no-files-found: error
          
